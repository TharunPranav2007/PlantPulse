<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlantPulse | Smart Industrial Operations & Predictive Maintenance Platform</title>
    <meta name="description" content="Enterprise industrial asset monitoring, predictive maintenance analytics, and operational work order management platform.">
    
    <!-- Google Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Design System CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-container">
    
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="brand-logo">
                <div class="brand-icon">
                    <i class="fas fa-bolt"></i>
                </div>
                <div class="brand-text">PLANT<span>PULSE</span></div>
            </div>
            <button class="sidebar-toggle-btn" title="Toggle Sidebar"><i class="fas fa-chevron-left"></i></button>
        </div>

        <nav class="sidebar-nav">
            <!-- Dynamically populated by js/app.js based on authenticated role -->
        </nav>

        <div class="sidebar-footer">
            <div class="system-status">
                <div class="status-dot"></div>
                <div class="system-status-text">Plant Grid Online</div>
            </div>
        </div>
    </aside>

    <!-- Main Content Wrapper -->
    <div class="main-wrapper">
        
        <!-- Top Navigation Header -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="mobile-menu-btn"><i class="fas fa-bars"></i></button>
                <div class="breadcrumbs">
                    <span>Industrial Plant Operations</span>
                    <i class="fas fa-chevron-right"></i>
                    <span class="current">Command Dashboard</span>
                </div>
            </div>

            <div class="topbar-right">
                <button class="global-search-btn global-search-trigger">
                    <i class="fas fa-search"></i>
                    <span>Search assets, work orders...</span>
                    <span class="search-shortcut">Ctrl+K</span>
                </button>

                <button class="icon-btn" id="themeToggleBtn" title="Toggle Theme">
                    <i class="fas fa-sun"></i>
                </button>

                <a href="pages/alerts.html" class="icon-btn" title="Alert Notifications">
                    <i class="fas fa-bell"></i>
                    <span class="dot-indicator"></span>
                </a>

                <div class="user-profile">
                    <!-- Dynamically populated by js/app.js -->
                </div>
            </div>
        </header>

        <!-- Main Dashboard Body -->
        <main class="content-body" id="dashboardRoot">
            <!-- Rendered dynamically by js/dashboard.js based on role -->
        </main>
    </div>
</div>

<!-- JavaScript Core Dependencies -->
<script src="js/mock-data.js"></script>
<script src="js/store.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>

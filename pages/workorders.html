<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Orders | PlantPulse Platform</title>
    
    <!-- EARLY THEME INITIALIZATION SCRIPT (PREVENTS THEME FLASHING) -->
    <script>
        (function() {
            var savedTheme = localStorage.getItem("plantpulse_theme") || "dark";
            document.documentElement.setAttribute("data-theme", savedTheme);
        })();
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="app-container">
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="brand-logo">
                <div class="brand-icon"><i class="fas fa-bolt"></i></div>
                <div class="brand-text">PLANT<span>PULSE</span></div>
            </div>
            <button class="sidebar-toggle-btn"><i class="fas fa-chevron-left"></i></button>
        </div>

        <nav class="sidebar-nav">
            <!-- Dynamically populated by js/app.js -->
        </nav>
    </aside>

    <div class="main-wrapper">
        <header class="topbar">
            <div class="topbar-left">
                <button class="mobile-menu-btn"><i class="fas fa-bars"></i></button>
                <div class="breadcrumbs">
                    <a href="../index.html">Operations</a>
                    <i class="fas fa-chevron-right"></i>
                    <span class="current">Work Orders Lifecycle</span>
                </div>
            </div>

            <div class="topbar-right">
                <button class="global-search-btn global-search-trigger"><i class="fas fa-search"></i><span>Search work orders...</span><span class="search-shortcut">Ctrl+K</span></button>
                <button class="icon-btn theme-toggle-trigger" id="themeToggleBtn"><i class="fas fa-sun"></i></button>
                <a href="alerts.html" class="icon-btn"><i class="fas fa-bell"></i><span class="dot-indicator"></span></a>
                <div class="user-profile"></div>
            </div>
        </header>

        <main class="content-body">
            <div class="page-header">
                <div class="page-title-group">
                    <h1>Work Orders Lifecycle</h1>
                    <p class="page-subtitle">Track work orders across OPEN, ASSIGNED, IN PROGRESS, RESOLVED, and CLOSED stages.</p>
                </div>
                <div class="page-actions">
                    <div style="display:inline-flex; border:1px solid var(--border-color); border-radius:var(--radius-md); overflow:hidden; background:var(--bg-card); margin-right:0.5rem;">
                        <button class="btn btn-sm btn-secondary active" id="viewKanbanBtn"><i class="fas fa-columns"></i> Kanban</button>
                        <button class="btn btn-sm btn-secondary" id="viewTableBtn"><i class="fas fa-list"></i> Table</button>
                    </div>
                    <button class="btn btn-primary" id="addWorkOrderBtn"><i class="fas fa-plus"></i> New Work Order</button>
                </div>
            </div>

            <div class="toolbar-bar">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="woSearchInput" class="search-input" placeholder="Search order ID, issue, technician...">
                </div>

                <div class="filter-group">
                    <select id="woStatusFilter" class="select-control">
                        <option value="ALL">All Statuses</option>
                        <option value="OPEN">OPEN</option>
                        <option value="ASSIGNED">ASSIGNED</option>
                        <option value="IN PROGRESS">IN PROGRESS</option>
                        <option value="RESOLVED">RESOLVED</option>
                        <option value="CLOSED">CLOSED</option>
                    </select>
                </div>
            </div>

            <!-- Dynamic Work Orders Container (Kanban / Table) -->
            <div id="workordersContainer">
                <!-- Rendered by js/workorders.js -->
            </div>
        </main>
    </div>
</div>

<script src="../js/mock-data.js"></script>
<script src="../js/store.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script src="../js/workorders.js"></script>
</body>
</html>

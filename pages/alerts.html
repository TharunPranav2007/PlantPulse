<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alert Center | PlantPulse Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="app-container">
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="brand-logo">
                <div class="brand-icon"><i class="fas fa-bolt"></i></div>
                <div class="brand-text">PLANT<span>PULSE</span></div>
            </div>
            <button class="sidebar-toggle-btn"><i class="fas fa-chevron-left"></i></button>
        </div>

        <nav class="sidebar-nav">
            <!-- Dynamically populated by js/app.js -->
        </nav>
    </aside>

    <div class="main-wrapper">
        <header class="topbar">
            <div class="topbar-left">
                <button class="mobile-menu-btn"><i class="fas fa-bars"></i></button>
                <div class="breadcrumbs">
                    <a href="../index.html">Operations</a>
                    <i class="fas fa-chevron-right"></i>
                    <span class="current">Alert Center</span>
                </div>
            </div>

            <div class="topbar-right">
                <button class="global-search-btn global-search-trigger"><i class="fas fa-search"></i><span>Search alerts...</span><span class="search-shortcut">Ctrl+K</span></button>
                <button class="icon-btn" id="themeToggleBtn"><i class="fas fa-sun"></i></button>
                <a href="alerts.html" class="icon-btn"><i class="fas fa-bell"></i><span class="dot-indicator"></span></a>
                <div class="user-profile"></div>
            </div>
        </header>

        <main class="content-body">
            <div class="page-header">
                <div class="page-title-group">
                    <h1>Critical Alert Center</h1>
                    <p class="page-subtitle">Real-time telemetry threshold alarms, overdue maintenance alerts, and automated work order dispatch.</p>
                </div>
            </div>

            <div class="toolbar-bar">
                <div class="filter-group">
                    <select id="alertSeverityFilter" class="select-control">
                        <option value="ALL">All Severities</option>
                        <option value="CRITICAL">CRITICAL Only</option>
                        <option value="WARNING">WARNING Only</option>
                        <option value="INFO">INFO Only</option>
                    </select>
                </div>
            </div>

            <div id="alertCenterList" style="max-width:800px;">
                <!-- Rendered by js/alerts.js -->
            </div>
        </main>
    </div>
</div>

<script src="../js/mock-data.js"></script>
<script src="../js/store.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script src="../js/alerts.js"></script>
</body>
</html>

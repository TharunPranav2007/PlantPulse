<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Schedules | PlantPulse Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="app-container">
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="brand-logo">
                <div class="brand-icon"><i class="fas fa-bolt"></i></div>
                <div class="brand-text">PLANT<span>PULSE</span></div>
            </div>
            <button class="sidebar-toggle-btn"><i class="fas fa-chevron-left"></i></button>
        </div>

        <nav class="sidebar-nav">
            <!-- Dynamically populated by js/app.js -->
        </nav>
    </aside>

    <div class="main-wrapper">
        <header class="topbar">
            <div class="topbar-left">
                <button class="mobile-menu-btn"><i class="fas fa-bars"></i></button>
                <div class="breadcrumbs">
                    <a href="../index.html">Operations</a>
                    <i class="fas fa-chevron-right"></i>
                    <span class="current">Maintenance Schedules</span>
                </div>
            </div>

            <div class="topbar-right">
                <button class="global-search-btn global-search-trigger"><i class="fas fa-search"></i><span>Search...</span><span class="search-shortcut">Ctrl+K</span></button>
                <button class="icon-btn" id="themeToggleBtn"><i class="fas fa-sun"></i></button>
                <a href="alerts.html" class="icon-btn"><i class="fas fa-bell"></i><span class="dot-indicator"></span></a>
                <div class="user-profile"></div>
            </div>
        </header>

        <main class="content-body">
            <div class="page-header">
                <div class="page-title-group">
                    <h1>Maintenance Management</h1>
                    <p class="page-subtitle">Schedule, track, and log Preventive, Corrective, Predictive, and Emergency maintenance events.</p>
                </div>
                <div class="page-actions">
                    <button class="btn btn-primary" id="addMaintBtn"><i class="fas fa-calendar-plus"></i> Schedule Maintenance</button>
                </div>
            </div>

            <div class="toolbar-bar">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="maintSearchInput" class="search-input" placeholder="Search maintenance ID, asset ID, tech name...">
                </div>

                <div class="filter-group">
                    <select id="maintTypeFilter" class="select-control">
                        <option value="ALL">All Maintenance Types</option>
                        <option value="Preventive">Preventive</option>
                        <option value="Corrective">Corrective</option>
                        <option value="Predictive">Predictive</option>
                        <option value="Emergency">Emergency</option>
                    </select>

                    <select id="maintStatusFilter" class="select-control">
                        <option value="ALL">All Statuses</option>
                        <option value="Scheduled">Scheduled</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                        <option value="Overdue">Overdue</option>
                    </select>
                </div>
            </div>

            <div class="card">
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Maintenance ID</th>
                                <th>Equipment ID</th>
                                <th>Type</th>
                                <th>Assigned Technician</th>
                                <th>Scheduled Date</th>
                                <th>Priority</th>
                                <th>Estimated Cost</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="maintTableBody">
                            <!-- Rendered by js/maintenance.js -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="../js/mock-data.js"></script>
<script src="../js/store.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script src="../js/maintenance.js"></script>
</body>
</html>

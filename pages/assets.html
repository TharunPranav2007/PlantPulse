<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Management | PlantPulse Industrial Platform</title>
    
    <!-- EARLY THEME INITIALIZATION SCRIPT (PREVENTS THEME FLASHING) -->
    <script>
        (function() {
            var savedTheme = localStorage.getItem("plantpulse_theme") || "dark";
            document.documentElement.setAttribute("data-theme", savedTheme);
        })();
    </script>

    <!-- Google Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="app-container">
    
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="brand-logo">
                <div class="brand-icon"><i class="fas fa-bolt"></i></div>
                <div class="brand-text">PLANT<span>PULSE</span></div>
            </div>
            <button class="sidebar-toggle-btn"><i class="fas fa-chevron-left"></i></button>
        </div>

        <nav class="sidebar-nav">
            <!-- Dynamically populated by js/app.js based on role permissions -->
        </nav>
    </aside>

    <!-- Main Content Wrapper -->
    <div class="main-wrapper">
        
        <header class="topbar">
            <div class="topbar-left">
                <button class="mobile-menu-btn"><i class="fas fa-bars"></i></button>
                <div class="breadcrumbs">
                    <a href="../index.html">Operations</a>
                    <i class="fas fa-chevron-right"></i>
                    <span class="current">Industrial Assets Management</span>
                </div>
            </div>

            <div class="topbar-right">
                <button class="global-search-btn global-search-trigger">
                    <i class="fas fa-search"></i>
                    <span>Search assets...</span>
                    <span class="search-shortcut">Ctrl+K</span>
                </button>
                <button class="icon-btn theme-toggle-trigger" id="themeToggleBtn"><i class="fas fa-sun"></i></button>
                <a href="alerts.html" class="icon-btn"><i class="fas fa-bell"></i><span class="dot-indicator"></span></a>
                <div class="user-profile"></div>
            </div>
        </header>

        <main class="content-body">
            
            <div class="page-header">
                <div class="page-title-group">
                    <h1>Industrial Assets Management</h1>
                    <p class="page-subtitle">Register, inspect telemetry, search, filter, and perform full CRUD operations on manufacturing plant machinery.</p>
                </div>
                <div class="page-actions">
                    <button class="btn btn-primary" id="addAssetBtn"><i class="fas fa-plus"></i> Add New Asset</button>
                </div>
            </div>

            <!-- Toolbar Search & Filters -->
            <div class="toolbar-bar">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="assetSearchInput" class="search-input" placeholder="Search by Asset ID, Name, Manufacturer...">
                </div>

                <div class="filter-group">
                    <select id="assetTypeFilter" class="select-control">
                        <option value="ALL">All Machine Types</option>
                        <option value="Milling">Milling</option>
                        <option value="Turning">Turning</option>
                        <option value="Robotics">Robotics</option>
                        <option value="Stamping">Stamping</option>
                        <option value="Compressors">Compressors</option>
                        <option value="Pumps">Pumps</option>
                        <option value="Thermodynamics">Thermodynamics</option>
                    </select>

                    <select id="assetStatusFilter" class="select-control">
                        <option value="ALL">All Statuses</option>
                        <option value="Operational">Operational</option>
                        <option value="Maintenance">Maintenance</option>
                        <option value="Critical">Critical</option>
                    </select>

                    <select id="assetSortSelect" class="select-control">
                        <option value="id_asc">Sort by Asset ID</option>
                        <option value="name_asc">Sort by Name</option>
                        <option value="health_desc">Health: High to Low</option>
                        <option value="health_asc">Health: Low to High</option>
                        <option value="hours_desc">Hours: High to Low</option>
                    </select>
                </div>
            </div>

            <!-- Assets Data Table -->
            <div class="card">
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Asset ID</th>
                                <th>Asset Name & Model</th>
                                <th>Category Type</th>
                                <th>Production Unit</th>
                                <th>Status</th>
                                <th>Health Score</th>
                                <th>Last Maintenance</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="assetsTableBody">
                            <!-- Dynamically generated by js/assets.js -->
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>
</div>

<script src="../js/mock-data.js"></script>
<script src="../js/store.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script src="../js/assets.js"></script>
</body>
</html>

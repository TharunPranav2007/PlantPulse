<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My User Profile | PlantPulse Platform</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="app-container">
    
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="brand-logo">
                <div class="brand-icon"><i class="fas fa-bolt"></i></div>
                <div class="brand-text">PLANT<span>PULSE</span></div>
            </div>
            <button class="sidebar-toggle-btn"><i class="fas fa-chevron-left"></i></button>
        </div>

        <nav class="sidebar-nav">
            <!-- Dynamically populated by js/app.js -->
        </nav>

        <div class="sidebar-footer">
            <div class="system-status">
                <div class="status-dot"></div>
                <div class="system-status-text">Plant Grid Online</div>
            </div>
        </div>
    </aside>

    <!-- Main Content Wrapper -->
    <div class="main-wrapper">
        
        <header class="topbar">
            <div class="topbar-left">
                <button class="mobile-menu-btn"><i class="fas fa-bars"></i></button>
                <div class="breadcrumbs">
                    <a href="../index.html">System</a>
                    <i class="fas fa-chevron-right"></i>
                    <span class="current">User Profile</span>
                </div>
            </div>

            <div class="topbar-right">
                <button class="global-search-btn global-search-trigger">
                    <i class="fas fa-search"></i>
                    <span>Search...</span>
                    <span class="search-shortcut">Ctrl+K</span>
                </button>
                <button class="icon-btn" id="themeToggleBtn"><i class="fas fa-sun"></i></button>
                <a href="alerts.html" class="icon-btn"><i class="fas fa-bell"></i><span class="dot-indicator"></span></a>
                <div class="user-profile"></div>
            </div>
        </header>

        <main class="content-body">
            
            <div class="page-header">
                <div class="page-title-group">
                    <h1>User Profile & Personnel Details</h1>
                    <p class="page-subtitle">View your authorized role parameters, employee metadata, and active work assignments.</p>
                </div>
            </div>

            <div style="max-width:850px; display:flex; flex-direction:column; gap:1.5rem;" id="profileRoot">
                <!-- Rendered dynamically -->
            </div>

        </main>
    </div>
</div>

<script src="../js/mock-data.js"></script>
<script src="../js/store.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const user = PlantPulseAuth.getCurrentUser();
        if (!user) return;

        const root = document.getElementById("profileRoot");
        if (root) {
            root.innerHTML = `
                <div class="card" style="padding:2rem;">
                    <div style="display:flex; align-items:center; gap:1.5rem; flex-wrap:wrap; padding-bottom:1.5rem; border-bottom:1px solid var(--border-color);">
                        <div class="avatar" style="width:72px; height:72px; font-size:1.8rem; border-radius:var(--radius-lg);">${user.avatar || 'US'}</div>
                        <div style="flex:1;">
                            <h2 style="font-size:1.5rem;">${user.name}</h2>
                            <div style="color:var(--accent-primary); font-weight:600; margin-top:2px;">${user.role}</div>
                            <div style="font-size:0.85rem; color:var(--text-muted); margin-top:4px;">Employee ID: <strong style="color:var(--text-primary); font-family:var(--font-mono);">${user.employeeId}</strong> • Department: ${user.department}</div>
                        </div>
                        <button class="btn btn-danger" onclick="PlantPulseAuth.logout()"><i class="fas fa-right-from-bracket"></i> Sign Out Session</button>
                    </div>

                    <div class="form-grid" style="margin-top:1.5rem;">
                        <div style="background:var(--bg-dark); border:1px solid var(--border-color); padding:1rem; border-radius:var(--radius-md);">
                            <div style="font-size:0.75rem; color:var(--text-muted); font-weight:700;">USERNAME / IDENTITY</div>
                            <div style="font-weight:600; color:var(--text-primary); margin-top:4px;">${user.username}</div>
                        </div>

                        <div style="background:var(--bg-dark); border:1px solid var(--border-color); padding:1rem; border-radius:var(--radius-md);">
                            <div style="font-size:0.75rem; color:var(--text-muted); font-weight:700;">EMAIL CONTACT</div>
                            <div style="font-weight:600; color:var(--text-primary); margin-top:4px;">${user.email || user.username + '@plantpulse.io'}</div>
                        </div>

                        <div style="background:var(--bg-dark); border:1px solid var(--border-color); padding:1rem; border-radius:var(--radius-md);">
                            <div style="font-size:0.75rem; color:var(--text-muted); font-weight:700;">SPECIALIZATION / SCOPE</div>
                            <div style="font-weight:600; color:var(--accent-primary); margin-top:4px;">${user.specialization || 'Full Operational Scope'}</div>
                        </div>

                        <div style="background:var(--bg-dark); border:1px solid var(--border-color); padding:1rem; border-radius:var(--radius-md);">
                            <div style="font-size:0.75rem; color:var(--text-muted); font-weight:700;">SESSION SECURITY</div>
                            <div style="font-weight:600; color:var(--status-success); margin-top:4px;"><i class="fas fa-shield-halved"></i> Active Stage 1 RBAC</div>
                        </div>
                    </div>
                </div>
            `;
        }
    });
</script>

</body>
</html>
